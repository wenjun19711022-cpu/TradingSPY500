name: spy-leverage

on:
  push:
    paths: ["spy-leverage/**", ".github/workflows/spy-leverage.yml"]
  pull_request:
    paths: ["spy-leverage/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spy-leverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
